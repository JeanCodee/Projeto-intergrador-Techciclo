{% extends 'base.html' %}
{% load static %}

{% block title%}TechCiclo - Economia Circular{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/cadastro_produtos-servicos.css' %}">
{% endblock %}

{% block content %}

<body>


<main class="cadastro-page">
    <h1 class="form-titulo">Cadastro de Produtos ou Serviços</h1>
    <p class="form-sub-titulo">Realize o Formulário abaixo para cadastrar seu produto ou serviço:</p>

    <form action="/cadastro_produtos-servicos" method="POST" class="cadastro-form">
        <label>Escolha o tipo:</label>
        <select name="tipo" id="tipo">
            <option value="produto">Produto</option>
            <option value="servico">Serviço</option>
        </select>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao" required></textarea>

        <label for="caracteristicas">Características:</label>
        <textarea id="caracteristicas" name="caracteristicas" required></textarea>

    <div id="campo-produto" class="grupo-formulario">
        <label for="condicao">Condição:</label>
        <select id="condicao" name="condicao" >
            <option value="novo">Novo</option>
            <option value="usado">Usado</option>
        </select>
    </div>

    <div class="grupo-formulario">
        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria" >
            <option value="games">Games</option>
            <option value="computador">Computador</option>
            <option value="celular">Celular</option>
            <option value="acessorios">Acessórios</option>
        </select>
    </div>

        <div id="campo-valores" class="grupo-formulario" style="display: none;">
            <label for="valor">Valor:</label>
            <input type="number" id="valor" name="valor" step="0.01">
        </div>

        <label for="imagem">Coloque uma imagem:</label>
        <input type="file" id="imagem" name="imagem" accept="image/*" required>

        <button type="submit">Cadastrar</button>
    </form>
</main>

    <script src="{% static 'js/cadastro_produtos-servicos.js' %}"></script>
    
</body>
</html>
